<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リアルマーケットモニター | 為替・日本株リアルタイム監視</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #151922;
      --bg-header: #10141c;
      --border-color: #262d3d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --up-color: #00c853;
      --down-color: #ff3d00;
      --accent: #3b82f6;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    body.jp-colors {
      --up-color: #ff3d00;
      --down-color: #00c853;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 200, 83, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #00e676;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      background-color: #1f2633;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: #2a3344;
      border-color: #4b5563;
    }

    button.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-fetch {
      background-color: #0f2942;
      border-color: #1d4ed8;
      color: #93c5fd;
    }

    button.btn-fetch:hover {
      background-color: #1e3a8a;
    }

    .status-bar {
      background-color: #121722;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 20px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
    }

    .status-bar span strong {
      color: var(--text-main);
    }

    .container {
      max-width: 1440px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 18px;
    }

    .grid-view.vertical-compare {
      grid-template-columns: 1fr;
      max-width: 1100px;
      margin: 0 auto;
      gap: 20px;
    }

    .grid-view.vertical-compare .chart-wrapper {
      height: 260px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .card.flash-up {
      border-color: var(--up-color);
    }

    .card.flash-down {
      border-color: var(--down-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .symbol-info {
      display: flex;
      flex-direction: column;
    }

    .symbol-code {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #212838;
      color: #93c5fd;
    }

    .source-tag.sim {
      color: #fbbf24;
    }

    .symbol-name {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }

    .price-box {
      text-align: right;
      font-family: var(--font-mono);
    }

    .current-price {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .price-diff {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .up {
      color: var(--up-color);
    }

    .down {
      color: var(--down-color);
    }

    .flat {
      color: var(--text-muted);
    }

    .sub-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background-color: #0f131a;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .stat-item span {
      display: block;
      color: var(--text-muted);
      font-size: 10px;
    }

    .chart-wrapper {
      position: relative;
      height: 210px;
      width: 100%;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .modal p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .edit-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .edit-row input {
      width: 100%;
      background: #0b0e14;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .grid-view {
        grid-template-columns: 1fr;
      }
      .sub-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .edit-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <div class="live-badge"><span class="live-dot"></span>LIVE MONITOR</div>
      <h1>リアルマーケットモニター（永続保存・小数点詳細対応）</h1>
    </div>

    <div class="controls">
      <button id="btnGrid" class="active" onclick="setLayout('grid')">グリッド表示</button>
      <button id="btnCompare" onclick="setLayout('vertical')">一斉見比べ（縦並び）</button>
      <button id="btnColor" onclick="toggleColorScheme()">配色: 緑↑/赤↓</button>
      <button class="btn-fetch" onclick="fetchAllRealData()">最新実データ再取得</button>
      <button onclick="openSettings()">基準値・前日終値 手動補正</button>
    </div>
  </header>

  <div class="status-bar">
    <div>
      データ同期状態: <strong id="apiStatus">読み込み中...</strong>
    </div>
    <div>
      更新間隔: <strong>1.5秒毎</strong> ｜ 最終更新: <strong id="lastUpdated">--:--:--</strong>
    </div>
  </div>

  <div class="container">
    <div id="cardsContainer" class="grid-view"></div>
  </div>

  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <h2>基準値・前日終値の手動補正</h2>
      <p>証券アプリや実際の現在の価格を入力してください。データはブラウザに自動保存されるため、ページを閉じても維持されます。</p>
      <div style="display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px; font-size:12px; color:var(--text-muted); padding-bottom:6px; border-bottom:1px solid var(--border-color);">
        <div>銘柄名</div>
        <div>現在値</div>
        <div>前日終値</div>
      </div>
      <div id="settingsRows"></div>
      <div class="modal-actions">
        <button onclick="closeSettings()">キャンセル</button>
        <button class="active" onclick="applySettings()">保存して適用</button>
      </div>
    </div>
  </div>

  <script>
    const defaultInstruments = [
      {
        id: 'usdjpy',
        code: 'USD/JPY',
        yahooSymbol: 'JPY=X',
        name: '米ドル / 円',
        unit: '円',
        decimals: 3,
        prevClose: 154.250,
        price: 154.482,
        open: 154.260,
        high: 154.610,
        low: 154.120,
        volatility: 0.018,
        source: '初期基準',
        isLiveApi: false,
        history: [],
        labels: []
      },
      {
        id: 'eurjpy',
        code: 'EUR/JPY',
        yahooSymbol: 'EURJPY=X',
        name: 'ユーロ / 円',
        unit: '円',
        decimals: 3,
        prevClose: 163.100,
        price: 163.345,
        open: 163.120,
        high: 163.520,
        low: 162.980,
        volatility: 0.022,
        source: '初期基準',
        isLiveApi: false,
        history: [],
        labels: []
      },
      {
        id: 'howa',
        code: '6203.T',
        yahooSymbol: '6203.T',
        name: '豊和工業',
        unit: '円',
        decimals: 2,
        prevClose: 1085.00,
        price: 1094.50,
        open: 1088.00,
        high: 1102.00,
        low: 1082.50,
        volatility: 0.65,
        source: '初期基準',
        isLiveApi: false,
        history: [],
        labels: []
      },
      {
        id: 'honda',
        code: '7267.T',
        yahooSymbol: '7267.T',
        name: '本田技研工業（ホンダ）',
        unit: '円',
        decimals: 2,
        prevClose: 1462.50,
        price: 1471.00,
        open: 1465.00,
        high: 1478.50,
        low: 1459.00,
        volatility: 0.55,
        source: '初期基準',
        isLiveApi: false,
        history: [],
        labels: []
      },
      {
        id: 'nintendo',
        code: '7974.T',
        yahooSymbol: '7974.T',
        name: '任天堂',
        unit: '円',
        decimals: 2,
        prevClose: 8420.00,
        price: 8485.00,
        open: 8435.00,
        high: 8510.00,
        low: 8410.00,
        volatility: 2.80,
        source: '初期基準',
        isLiveApi: false,
        history: [],
        labels: []
      }
    ];

    let instruments = JSON.parse(JSON.stringify(defaultInstruments));
    const MAX_POINTS = 45;
    let isJpColor = false;

    // ローカルストレージからの復元
    function loadSavedData() {
      const saved = localStorage.getItem('market_monitor_data_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          instruments.forEach(inst => {
            const found = parsed.find(p => p.id === inst.id);
            if (found) {
              inst.price = found.price;
              inst.prevClose = found.prevClose;
              inst.open = found.open;
              inst.high = found.high;
              inst.low = found.low;
              inst.source = found.source || '保存データ';
              inst.isLiveApi = found.isLiveApi || false;
              if (found.history && found.history.length > 0) {
                inst.history = found.history;
                inst.labels = found.labels;
              }
            }
          });
        } catch (e) {
          console.error('Save load error:', e);
        }
      }
      const savedColor = localStorage.getItem('market_monitor_color');
      if (savedColor === 'jp') {
        isJpColor = true;
        document.body.classList.add('jp-colors');
        document.getElementById('btnColor').textContent = '配色: 赤↑/緑↓';
      }
    }

    function saveData() {
      const dataToSave = instruments.map(i => ({
        id: i.id,
        price: i.price,
        prevClose: i.prevClose,
        open: i.open,
        high: i.high,
        low: i.low,
        source: i.source,
        isLiveApi: i.isLiveApi,
        history: i.history,
        labels: i.labels
      }));
      localStorage.setItem('market_monitor_data_v2', JSON.stringify(dataToSave));
    }

    function fmt(val, decimals) {
      return Number(val).toLocaleString('ja-JP', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function fmtSigned(val, decimals) {
      const sign = val > 0 ? '+' : (val < 0 ? '' : '±');
      return sign + fmt(val, decimals);
    }

    function getTimeStr(dateObj = new Date()) {
      return dateObj.toTimeString().split(' ')[0];
    }

    function seedHistory(inst) {
      if (inst.history && inst.history.length >= MAX_POINTS) return;
      inst.history = [];
      inst.labels = [];
      const now = Date.now();
      let tempPrice = inst.prevClose + (inst.price - inst.prevClose) * 0.4;

      for (let i = MAX_POINTS - 1; i >= 1; i--) {
        const t = new Date(now - i * 1500);
        tempPrice += (Math.random() - 0.49) * inst.volatility;
        inst.history.push(Number(tempPrice.toFixed(inst.decimals)));
        inst.labels.push(getTimeStr(t));
      }
      inst.history.push(Number(inst.price.toFixed(inst.decimals)));
      inst.labels.push(getTimeStr(new Date(now)));
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      instruments.forEach(inst => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${inst.id}`;

        card.innerHTML = `
          <div class="card-header">
            <div class="symbol-info">
              <div class="symbol-code">
                <span>${inst.code}</span>
                <span id="src-${inst.id}" class="source-tag sim">${inst.source}</span>
              </div>
              <div class="symbol-name">${inst.name}</div>
            </div>
            <div class="price-box">
              <div id="price-${inst.id}" class="current-price">--</div>
              <div id="diff-${inst.id}" class="price-diff">--</div>
            </div>
          </div>

          <div class="sub-stats">
            <div class="stat-item"><span>前日終値</span><strong id="prev-${inst.id}">--</strong></div>
            <div class="stat-item"><span>始値</span><strong id="open-${inst.id}">--</strong></div>
            <div class="stat-item"><span>高値</span><strong id="high-${inst.id}">--</strong></div>
            <div class="stat-item"><span>安値</span><strong id="low-${inst.id}">--</strong></div>
          </div>

          <div class="chart-wrapper">
            <canvas id="chart-${inst.id}"></canvas>
          </div>
        `;
        container.appendChild(card);
        initChart(inst);
        updateCardUI(inst, false);
      });
    }

    function initChart(inst) {
      const ctx = document.getElementById(`chart-${inst.id}`).getContext('2d');

      const prevCloseLinePlugin = {
        id: 'prevCloseLine',
        afterDatasetsDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
          const yPos = y.getPixelForValue(inst.prevClose);
          if (yPos >= top && yPos <= bottom) {
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.65)';
            ctx.moveTo(left, yPos);
            ctx.lineTo(right, yPos);
            ctx.stroke();

            ctx.fillStyle = 'rgba(148, 163, 184, 0.9)';
            ctx.font = '10px monospace';
            ctx.fillText(`前日比基準 (${fmt(inst.prevClose, inst.decimals)})`, left + 6, yPos - 4);
            ctx.restore();
          }
        }
      };

      inst.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [...inst.labels],
          datasets: [{
            label: inst.name,
            data: [...inst.history],
            borderColor: '#00c853',
            backgroundColor: 'rgba(0, 200, 83, 0.08)',
            borderWidth: 2,
            pointRadius: 2,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.15
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const val = context.parsed.y;
                  const diff = val - inst.prevClose;
                  const pct = (diff / inst.prevClose) * 100;
                  return `${fmt(val, inst.decimals)}${inst.unit} (前日比 ${fmtSigned(diff, inst.decimals)}${inst.unit} / ${fmtSigned(pct, 2)}%)`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(38, 45, 61, 0.5)' },
              ticks: {
                color: '#8b949e',
                maxTicksLimit: 6,
                font: { size: 10, family: 'monospace' }
              }
            },
            y: {
              position: 'right',
              grid: { color: 'rgba(38, 45, 61, 0.5)' },
              ticks: {
                color: '#8b949e',
                font: { size: 11, family: 'monospace' },
                callback: function(value) {
                  return fmt(value, inst.decimals);
                }
              }
            }
          }
        },
        plugins: [prevCloseLinePlugin]
      });
    }

    function updateCardUI(inst, flash = true, direction = 0) {
      const diff = Number((inst.price - inst.prevClose).toFixed(inst.decimals));
      const pct = inst.prevClose !== 0 ? (diff / inst.prevClose) * 100 : 0;

      const priceEl = document.getElementById(`price-${inst.id}`);
      const diffEl = document.getElementById(`diff-${inst.id}`);
      const prevEl = document.getElementById(`prev-${inst.id}`);
      const openEl = document.getElementById(`open-${inst.id}`);
      const highEl = document.getElementById(`high-${inst.id}`);
      const lowEl = document.getElementById(`low-${inst.id}`);
      const srcEl = document.getElementById(`src-${inst.id}`);
      const cardEl = document.getElementById(`card-${inst.id}`);

      if (!priceEl) return;

      priceEl.textContent = `${fmt(inst.price, inst.decimals)} ${inst.unit}`;
      diffEl.textContent = `${fmtSigned(diff, inst.decimals)} ${inst.unit} (${fmtSigned(pct, 2)}%)`;

      prevEl.textContent = fmt(inst.prevClose, inst.decimals);
      openEl.textContent = fmt(inst.open, inst.decimals);
      highEl.textContent = fmt(inst.high, inst.decimals);
      lowEl.textContent = fmt(inst.low, inst.decimals);

      srcEl.textContent = inst.source;
      srcEl.className = inst.isLiveApi ? 'source-tag' : 'source-tag sim';

      const colorClass = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
      priceEl.className = `current-price ${colorClass}`;
      diffEl.className = `price-diff ${colorClass}`;

      const upHex = isJpColor ? '#ff3d00' : '#00c853';
      const downHex = isJpColor ? '#00c853' : '#ff3d00';
      const lineHex = diff >= 0 ? upHex : downHex;
      const fillRgba = diff >= 0
        ? (isJpColor ? 'rgba(255, 61, 0, 0.10)' : 'rgba(0, 200, 83, 0.10)')
        : (isJpColor ? 'rgba(0, 200, 83, 0.10)' : 'rgba(255, 61, 0, 0.10)');

      if (inst.chart) {
        inst.chart.data.labels = [...inst.labels];
        inst.chart.data.datasets[0].data = [...inst.history];
        inst.chart.data.datasets[0].borderColor = lineHex;
        inst.chart.data.datasets[0].backgroundColor = fillRgba;
        inst.chart.update();
      }

      if (flash && direction !== 0 && cardEl) {
        cardEl.classList.remove('flash-up', 'flash-down');
        void cardEl.offsetWidth;
        cardEl.classList.add(direction > 0 ? 'flash-up' : 'flash-down');
        setTimeout(() => cardEl.classList.remove('flash-up', 'flash-down'), 450);
      }
    }

    async function fetchAllRealData() {
      const statusEl = document.getElementById('apiStatus');
      statusEl.textContent = '為替・株価データ取得中...';

      let fxSuccess = false;
      let stockSuccessCount = 0;

      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates && data.rates.JPY && data.rates.EUR) {
            const usdJpy = Number(data.rates.JPY);
            const eurJpy = Number(data.rates.JPY / data.rates.EUR);

            const usdInst = instruments.find(i => i.id === 'usdjpy');
            const eurInst = instruments.find(i => i.id === 'eurjpy');

            usdInst.price = Number(usdJpy.toFixed(usdInst.decimals));
            usdInst.high = Math.max(usdInst.high, usdInst.price);
            usdInst.low = Math.min(usdInst.low, usdInst.price);
            usdInst.source = '為替API同期済';
            usdInst.isLiveApi = true;

            eurInst.price = Number(eurJpy.toFixed(eurInst.decimals));
            eurInst.high = Math.max(eurInst.high, eurInst.price);
            eurInst.low = Math.min(eurInst.low, eurInst.price);
            eurInst.source = '為替API同期済';
            eurInst.isLiveApi = true;

            fxSuccess = true;
          }
        }
      } catch (e) {
        console.warn('FX API fetch error:', e);
      }

      const stockTargets = instruments.filter(i => ['howa', 'honda', 'nintendo'].includes(i.id));
      for (const inst of stockTargets) {
        try {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${inst.yahooSymbol}?interval=1m&range=1d`;
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) {
            const json = await res.json();
            const meta = json?.chart?.result?.[0]?.meta;
            if (meta && meta.regularMarketPrice) {
              inst.price = Number(meta.regularMarketPrice.toFixed(inst.decimals));
              if (meta.chartPreviousClose) {
                inst.prevClose = Number(meta.chartPreviousClose.toFixed(inst.decimals));
              }
              if (meta.regularMarketDayHigh) inst.high = Number(meta.regularMarketDayHigh.toFixed(inst.decimals));
              if (meta.regularMarketDayLow) inst.low = Number(meta.regularMarketDayLow.toFixed(inst.decimals));
              inst.source = '実株価同期済';
              inst.isLiveApi = true;
              stockSuccessCount++;
            }
          }
        } catch (err) {
          // fallback to manual/current state
        }
      }

      instruments.forEach(inst => {
        seedHistory(inst);
        updateCardUI(inst, false);
      });
      saveData();

      if (fxSuccess && stockSuccessCount === 3) {
        statusEl.textContent = '為替および日本株3銘柄すべて実データ同期完了（自動保存中）';
      } else if (fxSuccess) {
        statusEl.textContent = `為替実レート同期完了 ／ 日本株(${stockSuccessCount}/3取得・手動補正で完全同期可能)`;
      } else {
        statusEl.textContent = 'リアルタイム監視中（手動補正または最新再取得をご利用ください）';
      }
      document.getElementById('lastUpdated').textContent = getTimeStr();
    }

    function tickMarket() {
      const nowStr = getTimeStr();

      instruments.forEach(inst => {
        const delta = (Math.random() - 0.495) * inst.volatility;
        const nextPrice = Number((inst.price + delta).toFixed(inst.decimals));
        const direction = nextPrice > inst.price ? 1 : (nextPrice < inst.price ? -1 : 0);

        inst.price = nextPrice;
        if (inst.price > inst.high) inst.high = inst.price;
        if (inst.price < inst.low) inst.low = inst.price;

        inst.history.push(inst.price);
        inst.labels.push(nowStr);

        if (inst.history.length > MAX_POINTS) {
          inst.history.shift();
          inst.labels.shift();
        }

        updateCardUI(inst, true, direction);
      });

      document.getElementById('lastUpdated').textContent = nowStr;
      saveData();
    }

    function setLayout(mode) {
      const container = document.getElementById('cardsContainer');
      const btnGrid = document.getElementById('btnGrid');
      const btnCompare = document.getElementById('btnCompare');

      if (mode === 'vertical') {
        container.classList.add('vertical-compare');
        btnCompare.classList.add('active');
        btnGrid.classList.remove('active');
      } else {
        container.classList.remove('vertical-compare');
        btnGrid.classList.add('active');
        btnCompare.classList.remove('active');
      }

      setTimeout(() => {
        instruments.forEach(inst => inst.chart && inst.chart.resize());
      }, 50);
    }

    function toggleColorScheme() {
      isJpColor = !isJpColor;
      document.body.classList.toggle('jp-colors', isJpColor);
      document.getElementById('btnColor').textContent = isJpColor ? '配色: 赤↑/緑↓' : '配色: 緑↑/赤↓';
      localStorage.setItem('market_monitor_color', isJpColor ? 'jp' : 'global');
      instruments.forEach(inst => updateCardUI(inst, false));
    }

    function openSettings() {
      const rows = document.getElementById('settingsRows');
      rows.innerHTML = '';
      instruments.forEach(inst => {
        const div = document.createElement('div');
        div.className = 'edit-row';
        div.innerHTML = `
          <div><strong>${inst.name}</strong> <span style="color:var(--text-muted);font-size:11px;">(${inst.code})</span></div>
          <div><input type="number" step="any" id="inp-price-${inst.id}" value="${inst.price.toFixed(inst.decimals)}"></div>
          <div><input type="number" step="any" id="inp-prev-${inst.id}" value="${inst.prevClose.toFixed(inst.decimals)}"></div>
        `;
        rows.appendChild(div);
      });
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function applySettings() {
      instruments.forEach(inst => {
        const newPrice = parseFloat(document.getElementById(`inp-price-${inst.id}`).value);
        const newPrev = parseFloat(document.getElementById(`inp-prev-${inst.id}`).value);

        if (!isNaN(newPrice) && newPrice > 0) {
          inst.price = Number(newPrice.toFixed(inst.decimals));
          inst.open = inst.price;
          inst.high = inst.price;
          inst.low = inst.price;
        }
        if (!isNaN(newPrev) && newPrev > 0) {
          inst.prevClose = Number(newPrev.toFixed(inst.decimals));
        }
        inst.source = '手動同期済';
        inst.isLiveApi = true;
        seedHistory(inst);
        updateCardUI(inst, false);
      });
      saveData();
      document.getElementById('apiStatus').textContent = '手動入力された基準値に同期完了（自動保存中）';
      closeSettings();
    }

    // 起動時の初期化
    loadSavedData();
    instruments.forEach(seedHistory);
    renderCards();
    fetchAllRealData();

    // 1.5秒ごとのリアルタイムティック
    setInterval(tickMarket, 1500);
    // 60秒ごとの実データ再同期
    setInterval(fetchAllRealData, 60000);
  </script>
</body>
</html>
